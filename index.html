      <div class="title" id="monthName">Picture Memory Game</div>

    <div id="content">
      <div class="instructions">
        Each tile hides a picture. There are 8 pairs of pictures to be matched.
        Uncover two tiles at a time until you match each pair to win the game!
      </div>
      <table id="table">
        <tr id="tr1">
          <td id="te11" class="teText"></td>
          <td id="te12" class="teText"></td>

        </tr>

          <td id="te32" class="teText"></td>
          <td id="te33" class="teText"></td>
          <td id="te34" class="teText"></td>
        </tr>

        <tr id="tr4">

          <td id="te42" class="teText"></td>

          <td id="te44" class="teText"></td>
        </tr>
      </table>
    </div>
